<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Список задач</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page">
    <h1 class="page__title">Список задач</h1>

    <div class="bar">
      <button class="btn" id="sortBtn" type="button">Сортировать по важности</button>
      <button class="btn btn--ghost" id="filterBtn" type="button">Только важные</button>
      <span class="bar__counter">Действий: <b id="actions">0</b></span>
    </div>

    <ul class="list" id="list"></ul>
  </main>

</body>
</html>
